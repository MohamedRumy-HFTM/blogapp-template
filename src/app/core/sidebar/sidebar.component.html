<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport mode="over" role="navigation">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="drawer.close()"
        >Blog</a
      >
      <a mat-list-item routerLink="/about" routerLinkActive="active-link" (click)="drawer.close()"
        >About</a
      >
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="app-toolbar">
      @if (layout.isMobile()) {
        <button mat-icon-button type="button" aria-label="Menü öffnen" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span>{{ title }}</span>
      <span class="spacer"></span>

      @if (!layout.isMobile()) {
        <nav class="nav">
          <a
            mat-button
            routerLink="/"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            >Blog</a
          >
          <a mat-button routerLink="/about" routerLinkActive="active-link">About</a>
        </nav>
      }

      @if (authStore.loading()) {
        <span class="user-name">…</span>
      } @else {
        @if (authStore.isAuthenticated()) {
          <span class="user-name">{{ authStore.user()?.name }}</span>
          <button mat-button type="button" (click)="authStore.logout()">Logout</button>
        } @else {
          <a mat-button routerLink="/login" routerLinkActive="active-link">Login</a>
        }
      }

      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="isDarkMode() ? 'Light Mode aktivieren' : 'Dark Mode aktivieren'"
        (click)="toggleDarkMode()"
      >
        <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
