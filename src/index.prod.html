<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Produktions-Index (angular.json → configurations.production.index).
      Azure Storage Static Website kann keine eigenen Response-Header setzen,
      deshalb kommt die CSP hier als <meta>. frame-ancestors wirkt im Meta-Tag nicht
      und fehlt darum; im Dev-Server kommt die CSP als echter Header (angular.json → serve).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://d-cap-blog-backend---v2.whitepond-b96fee4b.westeurope.azurecontainerapps.io; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Angular Template</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
